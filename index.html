<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* 전체 레이아웃 (상단 컨테이너 + 하단 버튼) */
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 30px; /* 상자와 하트 사이의 간격 */
        }

        /* 양쪽 상자와 바를 묶어주는 래퍼 */
        .box-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 150px;
        }

        /* 사각형 공통 스타일 */
        .box {
            width: 150px;
            height: 60px;
            border: 2px solid black; /* 검은 테두리 */
            border-radius: 0; /* 라운드 없는 직사각형 */
            color: black; /* 검은 글씨 */
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .box:hover {
            background-color: #f0f0f0;
        }

        .box:active {
            transform: scale(0.95);
        }

        /* 중앙 하트 스타일 */
        .heart {
            font-size: 40px;
            color: red;
            visibility: hidden; /* 처음에는 숨김 */
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.1s ease;
            cursor: default;
            user-select: none;
        }

        .heart.show {
            visibility: visible;
            opacity: 1;
            cursor: pointer;
            animation: popHeart 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart.show:active {
            transform: scale(0.8);
        }

        @keyframes popHeart {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 호감도 퍼센티지 바 */
        .progress-container {
            width: 100%;
            height: 22px;
            border: 2px solid black;
            background-color: white;
            position: relative;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .progress-container.show {
            visibility: visible;
            opacity: 1;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9fb3;
            transition: width 0.2s ease;
        }

        .progress-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            color: black;
        }

        .placeholder {
            height: 26px;
            width: 100%;
        }

        /* 다시 시작 버튼 스타일 (동일하게 검은 테두리 직사각형) */
        .reset-btn {
            width: 120px;
            height: 40px;
            border: 2px solid black;
            border-radius: 0;
            background-color: white;
            color: black;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* 100% 되기 전까지 숨김 */
            transition: all 0.2s ease;
        }

        .reset-btn.show {
            display: block;
        }

        .reset-btn:hover {
            background-color: black;
            color: white;
        }

        .reset-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <!-- 좌측 섹션 -->
            <div class="box-wrapper">
                <div class="box" id="leftBox">🖱️ 클릭</div>
                <div class="placeholder"></div> 
            </div>
            
            <!-- 중앙 하트 -->
            <div class="heart" id="heart">❤️</div>
            
            <!-- 우측 섹션 -->
            <div class="box-wrapper">
                <div class="box" id="rightBox">🖱️ 클릭</div>
                
                <!-- 호감도 바 -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-bar" id="progressBar"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
            </div>
        </div>

        <!-- 다시 시작 버튼 -->
        <button class="reset-btn" id="resetBtn">🔄 다시 시작</button>
    </div>

    <script>
        const leftBox = document.getElementById('leftBox');
        const rightBox = document.getElementById('rightBox');
        const heart = document.getElementById('heart');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const resetBtn = document.getElementById('resetBtn');

        let isLeftClicked = false;
        let isRightClicked = false;
        let affectionLevel = 0;

        // 좌측 상자 클릭
        leftBox.addEventListener('click', () => {
            if (!isLeftClicked) {
                leftBox.innerHTML = '이도윤'; 
                isLeftClicked = true;
                checkBothClicked(); 
            }
        });

        // 우측 상자 클릭
        rightBox.addEventListener('click', () => {
            if (!isRightClicked) {
                rightBox.innerHTML = '황서현'; 
                isRightClicked = true;
                checkBothClicked(); 
            }
        });

        function checkBothClicked() {
            if (isLeftClicked && isRightClicked) {
                heart.classList.add('show'); 
            }
        }

        // 하트 클릭 이벤트 (랜덤 호감도 -5% ~ +10%)
        heart.addEventListener('click', () => {
            if (isLeftClicked && isRightClicked && affectionLevel < 100) {
                
                if (!progressContainer.classList.contains('show')) {
                    progressContainer.classList.add('show');
                }

                // -5부터 +10까지의 랜덤 정수 생성
                const randomDelta = Math.floor(Math.random() * 11) - 3;
                
                // 0 미만으로 떨어지지 않게 처리
                affectionLevel = Math.max(0, affectionLevel + randomDelta);

                // 100% 이상일 경우 처리
                if (affectionLevel >= 100) {
                    affectionLevel = 100;
                    progressBar.style.width = '100%';
                    progressText.innerHTML = '100% MAX! 💕';
                    progressText.style.color = 'white';
                    progressText.style.textShadow = '1px 1px 2px black';
                    
                    // 다시 시작 버튼 등장
                    resetBtn.classList.add('show');
                } else {
                    progressBar.style.width = affectionLevel + '%';
                    progressText.innerHTML = affectionLevel + '%';
                    progressText.style.color = 'black';
                    progressText.style.textShadow = 'none';
                }
            }
        });

        // 다시 시작 버튼 클릭 (초기화)
        resetBtn.addEventListener('click', () => {
            isLeftClicked = false;
            isRightClicked = false;
            affectionLevel = 0;

            leftBox.innerHTML = '🖱️ 클릭';
            rightBox.innerHTML = '🖱️ 클릭';

            heart.classList.remove('show');
            progressContainer.classList.remove('show');
            resetBtn.classList.remove('show');

            progressBar.style.width = '0%';
            progressText.innerHTML = '0%';
            progressText.style.color = 'black';
            progressText.style.textShadow = 'none';
        });
    </script>

</body>
</html>
