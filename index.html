<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이도윤 ❤️ 황서현</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 30px; /* 상자와 하트 사이의 간격 */
        }

        /* 사각형 공통 스타일 */
        .box {
            width: 150px;
            height: 60px;
            border: 2px solid black; /* 검은 테두리 */
            border-radius: 0; /* 라운드 없는 직사각형 */
            color: black; /* 검은 글씨 */
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        /* 마우스를 올렸을 때 살짝 강조 */
        .box:hover {
            background-color: #f0f0f0;
        }

        /* 클릭될 때 살짝 눌리는 효과 */
        .box:active {
            transform: scale(0.95);
        }

        /* 중앙 하트 스타일 */
        .heart {
            font-size: 40px;
            color: red;
            visibility: hidden; /* 처음에는 숨김 */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 하트가 나타날 때 적용될 클래스 및 애니메이션 */
        .heart.show {
            visibility: visible;
            opacity: 1;
            animation: popHeart 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popHeart {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 좌측 상자 -->
        <div class="box" id="leftBox">🖱️ 클릭</div>
        
        <!-- 중앙 하트 -->
        <div class="heart" id="heart">❤️</div>
        
        <!-- 우측 상자 -->
        <div class="box" id="rightBox">🖱️ 클릭</div>
    </div>

    <script>
        // 요소 가져오기
        const leftBox = document.getElementById('leftBox');
        const rightBox = document.getElementById('rightBox');
        const heart = document.getElementById('heart');

        // 클릭 상태 저장 변수
        let isLeftClicked = false;
        let isRightClicked = false;

        // 좌측 상자 클릭 이벤트
        leftBox.addEventListener('click', () => {
            if (!isLeftClicked) {
                leftBox.innerHTML = '이도윤'; // 글씨 변경
                isLeftClicked = true;
                checkBothClicked(); // 둘 다 눌렸는지 확인
            }
        });

        // 우측 상자 클릭 이벤트
        rightBox.addEventListener('click', () => {
            if (!isRightClicked) {
                rightBox.innerHTML = '황서현'; // 글씨 변경
                isRightClicked = true;
                checkBothClicked(); // 둘 다 눌렸는지 확인
            }
        });

        // 두 상자 모두 클릭되었는지 확인하고 하트를 띄우는 함수
        function checkBothClicked() {
            if (isLeftClicked && isRightClicked) {
                heart.classList.add('show'); // 하트 표시
            }
        }
    </script>

</body>
</html>
